---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: piworkers.ubi.pi.dev
spec:
  group: ubi.pi.dev
  names:
    kind: PiWorker
    listKind: PiWorkerList
    plural: piworkers
    shortNames:
    - piw
    singular: piworker
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.host
      name: Host
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      priority: 10
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PiWorker is the Schema for the piworkers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PiWorker
            properties:
              auth:
                description: auth configures client authentication to the public agent
                  endpoint.
                properties:
                  allowedOrigins:
                    description: |-
                      allowedOrigins restricts browser WebSocket connections to these Origin values.
                      Non-browser CLI clients without an Origin header are always allowed. When empty,
                      browser connections are rejected.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                type: object
              ingress:
                description: ingress configures the public exposure of the agent.
                properties:
                  className:
                    description: className is the IngressClass name to use. When omitted
                      the cluster default applies.
                    maxLength: 253
                    type: string
                  tlsSecretName:
                    description: |-
                      tlsSecretName is the name of a same-namespace TLS Secret covering the wildcard domain.
                      Required when the manager requires TLS for the public endpoint.
                    maxLength: 253
                    type: string
                type: object
              litellm:
                description: litellm configures the OpenAI-compatible LiteLLM endpoint
                  and credentials.
                properties:
                  apiKey:
                    description: |-
                      apiKey is the LiteLLM API key value (e.g. sk-litellm-...). The controller projects it
                      into the worker Pod via a controller-owned Secret that is deleted with this PiWorker.
                      The value is never placed in the Pod env or argv — only the mounted file is read at
                      request time. Note the key is stored in the PiWorker spec and is therefore visible to
                      anyone who can read PiWorker objects.
                    maxLength: 4096
                    minLength: 1
                    type: string
                  baseURL:
                    description: baseURL is the OpenAI-compatible LiteLLM endpoint,
                      e.g. http://litellm-proxy:4000/v1.
                    maxLength: 2048
                    minLength: 1
                    type: string
                required:
                - apiKey
                - baseURL
                type: object
              model:
                description: model is the LiteLLM model name the agent uses, e.g.
                  "gpt-4.1" or "claude-sonnet-4".
                maxLength: 256
                minLength: 1
                type: string
              resources:
                description: |-
                  resources optionally overrides compute resources for the worker Pod. The controller
                  applies conservative defaults when omitted.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              workerImage:
                description: |-
                  workerImage overrides the operator-configured worker image for this PiWorker. When
                  omitted, the manager --worker-image default applies. Setting this lets a PiWorker
                  author run an arbitrary container image in the agent Pod, so the PiWorker namespace
                  must be trusted.
                maxLength: 253
                type: string
              workerImagePullSecret:
                description: |-
                  workerImagePullSecret, when set together with workerImage, is the name of a
                  same-namespace Secret of type kubernetes.io/dockerconfigjson the worker Pod uses to
                  pull workerImage from a private registry. When omitted the manager
                  --worker-image-pull-secret default applies.
                maxLength: 253
                type: string
              workspace:
                description: workspace configures the agent working directory.
                properties:
                  persistentVolumeClaimName:
                    description: |-
                      persistentVolumeClaimName, when set, mounts an existing same-namespace PVC at
                      /workspace for durable work. When omitted an emptyDir is used.
                    maxLength: 253
                    type: string
                type: object
            required:
            - auth
            - litellm
            - model
            type: object
          status:
            description: status defines the observed state of PiWorker
            properties:
              bearerTokenSecretRef:
                description: |-
                  bearerTokenSecretRef is the controller-owned Secret/key holding the auto-generated
                  client bearer token. Clients present it as `Authorization: Bearer <token>` to the
                  public endpoint. Retrieve it with:
                    kubectl get secret <name> -n <ns> -o jsonpath='{.data.<key>}' | base64 -d
                properties:
                  key:
                    description: key inside the Secret that holds the credential value.
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: name of the Secret holding the credential.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              conditions:
                description: conditions represent the current state of the PiWorker
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: endpoint is the full public WebSocket URL clients connect
                  to.
                type: string
              host:
                description: host is the generated public hostname, e.g. pw-<token>.<domain>.
                type: string
              ingressName:
                description: ingressName is the name of the managed Ingress.
                type: string
              observedGeneration:
                description: observedGeneration is the generation most recently reconciled.
                format: int64
                type: integer
              serviceName:
                description: serviceName is the name of the managed Service.
                type: string
              workloadName:
                description: workloadName is the name of the managed Deployment.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
