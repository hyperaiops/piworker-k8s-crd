apiVersion: ubi.pi.dev/v1alpha1
kind: PiWorker
metadata:
  labels:
    app.kubernetes.io/name: piworker
    app.kubernetes.io/managed-by: kustomize
  name: my-agent
spec:
  # LiteLLM model name routable by the proxy.
  model: glm-5.3-flash
  litellm:
    # OpenAI-compatible LiteLLM endpoint.
    baseURL: https://llm.ubichat.ubisoft.org
    # apiKey is the LiteLLM API key value, provided here at creation time. The controller
    # projects it into the worker Pod from a controller-owned Secret that is deleted with
    # this PiWorker — no separate `kubectl create secret` step is needed.
    # NOTE: the value is stored in etcd inside the PiWorker spec, so it is visible to anyone
    # who can read PiWorker objects.
    apiKey: sk-litellm-REPLACE-ME
  auth:
    # The client bearer token is auto-generated by the controller into an owned Secret and
    # exposed in .status.bearerTokenSecretRef. Retrieve it with:
    #   kubectl get piworker my-agent -o jsonpath='{.status.bearerTokenSecretRef.name}'
    #   kubectl get secret <name> -o jsonpath='{.data.token}' | base64 -d
    allowedOrigins:
      - "*"
  ingress:
    className: nginx
    # TLS Secret covering *.<manager --ingress-domain>. Optional if TLS is terminated
    # elsewhere or the manager default is used.
    tlsSecretName: wildcard-agents-tls
  # workspace is ephemeral (emptyDir) by default. To persist, set:
  # workspace:
  #   persistentVolumeClaimName: my-agent-workspace
  # workerImage / workerImagePullSecret override the manager --worker-image /
  # --worker-image-pull-secret defaults. Setting workerImage lets a PiWorker author run an
  # arbitrary image in the agent Pod, so the namespace must be trusted. Leave unset to use the
  # operator-configured worker image.
  workerImage: ghcr.io/hyperaiops/piworker-worker:v0.0.2
  workerImagePullSecret: ghcr-pull-secret
