# This rule is not used by the project piworker itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ubi.pi.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: piworker
    app.kubernetes.io/managed-by: kustomize
  name: piworker-editor-role
rules:
- apiGroups:
  - ubi.pi.dev
  resources:
  - piworkers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ubi.pi.dev
  resources:
  - piworkers/status
  verbs:
  - get
